services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      # Redis keeps its data under 3 GB, dropping the least recently used entries
      - REDIS_ARGS=--maxmemory 3gb --maxmemory-policy allkeys-lru
    mem_limit: 4g  # hard cap for the whole container, with room for Redis's own overhead
    restart: unless-stopped

volumes:
  redis-data:
