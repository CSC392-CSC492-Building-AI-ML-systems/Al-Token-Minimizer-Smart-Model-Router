[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
